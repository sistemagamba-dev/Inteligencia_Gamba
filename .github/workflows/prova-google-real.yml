# Prova única do Gate Google real (Issue #1). Somente nesta branch isolada.
# Dispara apenas quando este arquivo muda em push para prova/google-real.
# Sem actions de terceiros, sem artefatos, sem cache; segredo só no passo da prova.
name: prova-google-real
on:
  push:
    branches: [prova/google-real]
    paths: ['.github/workflows/prova-google-real.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: prova-google-real
  cancel-in-progress: false
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código do commit (repositório público, sem token)
        run: |
          git init -q . && git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Dependências fixadas
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pypdf==6.10.0 openpyxl==3.1.5 google-auth==2.49.1 requests==2.32.5
      - name: Prova real (APIs Google)
        env:
          JANUS_GOOGLE_SA_JSON: ${{ secrets.JANUS_GOOGLE_SA_JSON }}
          JANUS_REPORT: report.md
        run: .venv/bin/python -m experiments.sheets_poc.real_google
      - name: Evidência na Issue #1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f report.md || echo "Prova não gerou relatório (falha antes da execução)." > report.md
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body-file report.md
