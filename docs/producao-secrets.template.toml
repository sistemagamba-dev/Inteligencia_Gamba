# JANUS - segredos de PRODUCAO (modelo; somente placeholders <...>)
# Colar SOMENTE em: Streamlit Community Cloud > app > Settings > Secrets, no gate de virada.
# Nunca no GitHub, Issue, PR, chat, log ou e-mail.
#
# REGRA TOML: todas as chaves JANUS_* ficam ANTES de [auth]. Qualquer linha abaixo de
# [auth] pertence a essa secao e NAO vira variavel de ambiente (o app nao a enxergaria).
# Valores de raiz devem ser STRINGS: o Streamlit so exporta para os.environ valores
# str/int/float (listas, booleanos e tabelas nao sao exportados).
#
# Legenda: [ID]     = identificador, nao e credencial, mas nao publicar (mostra a estrutura)
#          [SEGREDO] = credencial; vazamento exige rotacao

# --- Ambiente (texto fixo, nao secreto) ---
JANUS_MODE = "google"            # producao exige google; "local" = recusa
JANUS_AMBIENTE = "producao"      # sem esta linha o app roda como HOMOLOGACAO (prefixo JANUS_TESTE)

# --- Google Drive / Sheets [ID] ---
# IDs completos: copiar da barra de endereco do Drive (conta sistgam@gmail.com).
# Formato aceito pelo codigo: somente [A-Za-z0-9_-]; quatro pastas diferentes entre si.
JANUS_SHEET_ID = "<ID da planilha JANUS_PRODUCAO_BASE - comeca com 1WWA0f>"   # abas journal + usuarios
JANUS_ROOT = "<ID da pasta raiz JANUS_PRODUCAO - comeca com 1QuIxc>"          # nome da pasta deve comecar com JANUS_PRODUCAO
JANUS_ENTRADA = "<ID da pasta entrada - comeca com 1I3S_r>"                   # filha direta da raiz
JANUS_PROCESSADOS = "<ID da pasta processados - comeca com 1IENk_>"           # filha direta da raiz
JANUS_FALHAS = "<ID da pasta falhas - comeca com 1SvWJL>"                     # filha direta da raiz
# NAO definir JANUS_TEST_ROOT em producao (sinonimo legado; se divergir de JANUS_ROOT, recusa).

# --- Acesso (e-mails, nao secretos, mas dados pessoais: nao publicar) ---
JANUS_ADMIN_EMAILS = "<email-adm-1>,<email-adm-2>"   # string separada por virgula; e-mail invalido = app nao inicia
JANUS_ALLOWED_EMAILS = ""                            # legado; manter vazio (acesso via aba usuarios + Adm)

# --- Conta de servico janus-integracao@janus-producao [SEGREDO] ---
# Colar o conteudo INTEIRO do arquivo .json baixado entre as aspas simples triplas.
# Use ''' (literal): mantem o "\n" do private_key como dois caracteres, que o JSON converte.
# NAO use """ (basica): o TOML trocaria \n por quebra de linha real e o JSON ficaria invalido.
JANUS_GOOGLE_SA_JSON = '''
{
  "type": "service_account",
  "project_id": "<janus-producao>",
  "private_key_id": "<SEGREDO>",
  "private_key": "-----BEGIN PRIVATE KEY-----\n<SEGREDO - manter os \n exatamente como no arquivo>\n-----END PRIVATE KEY-----\n",
  "client_email": "<janus-integracao@janus-producao.iam.gserviceaccount.com>",
  "client_id": "<ID numerico>",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token",
  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
  "client_x509_cert_url": "<URL do arquivo>",
  "universe_domain": "googleapis.com"
}
'''

# --- Login Google (st.login) - DEVE ser a ultima secao ---
[auth]
redirect_uri = "https://<subdominio>.streamlit.app/oauth2callback"  # igual ao URI no cliente OAuth "JANUS Web"
cookie_secret = "<SEGREDO - gerar localmente, ver regra>"            # aleatorio, exclusivo da producao
client_id = "<ID - ....apps.googleusercontent.com>"                  # cliente OAuth Web do projeto janus-producao
client_secret = "<SEGREDO - client secret do cliente JANUS Web>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
